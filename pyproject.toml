[project]
name = "async_btree"
version = "2.0.0"
description = "Async behavior tree"
authors = [{ name = "Jerome Guibert", email = "jguibert@gmail.com" }]
readme = "README.md"
license = "MIT"
keywords = ["behavior-tree", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11,<4"
license-files = ["LICENSE.md"]

[project.urls]
homepage = "https://pypi.org/project/async_btree"
documentation = "https://geronimo-iia.github.io/async-btree/"
repository = "https://github.com/geronimo-iia/async-btree"


[project.optional-dependencies]
curio = ["curio-compat ~=1.6.7"]

[dependency-groups]
dev =  [
    "ruff ~= 0.9",
    "pyright ~= 1.1",
    "pytest >= 8",
    "pytest-cov >= 5",
    "pytest-mock >=3",
    "pytest-asyncio >= 0.24,< 1.3",
    "xdoctest >=1.2,<1.4", # A rewrite of the builtin doctest module
    "coverage[toml] >= 7.6.10",
    "setuptools>=82",
]
curio = [
    "curio-compat ~=1.6.7",
    "pytest-curio >= 1.1.0",
]
docs = [
    "mkdocs~= 1.6",
    "mkdocstrings[python] ~= 0.27",
    "mkdocs-material == 9.*",
    "mkdocs-include-markdown-plugin >= 7.1.2,< 7.3.0"
]

# fix pytest-curio for now
[[tool.uv.dependency-metadata]]
name = "pytest-curio"
version = "1.1.0"
requires-dist = ["curio-compat ~=1.6.7"]

[tool.setuptools]
packages = ["async_btree"]

[tool.uv]
package = true
cache-dir = "./.cache"
default-groups = ["dev", "docs"]

#[tool.uv.sources]
#curio = { git = "https://github.com/dabeaz/curio.git", branch = "master" }

[tool.coverage.paths]
source = ["async_btree"]

[tool.coverage.run]
# see https://coverage.readthedocs.io/en/coverage-5.0.3/config.html
branch = true
data_file = ".cache/coverage"
source = ["async_btree"]
omit = ["tests/*", ".venv/*", "*/__main__.py", "examples/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --pdbcls=tests:Debugger -r sxX --cov=async_btree --cov-report=html --cov-report=term-missing:skip-covered"
cache_dir = ".cache"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "curio: tests requiring curio backend",
    "all_backends: run with both asyncio and curio backends",
]

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-builtins
    "A",
    # pep8-naming
    "N",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # type-checking imports
    "TCH",
    # ruff-specific
    "RUF",
]
ignore = ["N818", "E501", "E402"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"


[tool.pyright]
include = ["async_btree"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "async_btree/experimental",
    "async_btree/typestubs",
]
ignore = ["tests"]
defineConstant = { DEBUG = true }
reportMissingImports = true
reportMissingTypeStubs = false

pythonVersion = "3.11"
pythonPlatform = "Linux"


[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

