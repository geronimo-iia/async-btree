site_name: Async behavior tree
repo_url: https://github.com/geronimo-iia/async-btree
repo_name: geronimo-iia/async-btree
docs_dir: docs
site_dir: site

theme:
  name: "material"
  features:
    - navigation.tracking
    - navigation.path
    - navigation.instant
    - navigation.tabs
    - navigation.indexes

plugins:
  - search
  - include-markdown
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            docstring_style: google

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Tutorial: tutorial.md
  - API Reference: reference/
  - Invariants: invariants.md
  - Decisions:
    - anyio as Sole Backend: decisions/anyio-as-sole-backend.md
    - ControlFlowException as Falsy: decisions/control-flow-exception-as-falsy.md
    - Context Isolation per Run: decisions/context-isolation-per-run.md
    - List-Wrapping in sequence/fallback: decisions/list-wrapping-in-sequence-fallback.md
    - do_while vs repeat_while: decisions/do-while-vs-repeat-while.md
  - Changelog: changelog.md
  - Migration:
    - curio → anyio (3.0.0): migration/curio-to-anyio.md
    - asyncio → anyio (3.0.0): migration/asyncio-to-anyio.md
  - Contributing: contributing.md
  - License: license.md
  - Code of Conduct: code_of_conduct.md
  - GitHub: https://github.com/geronimo-iia/async-btree
